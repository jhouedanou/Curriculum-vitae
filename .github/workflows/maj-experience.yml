name: Années d'expérience

# Recalcule les années par compétence (dates « depuis » de job-bot/cv.yaml) dans les CV Markdown et leurs PDF.
# Le 1er de chaque mois ; commit sur main seulement si un nombre a changé.
on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Outils
        run: pip install pyyaml

      - name: Recalculer
        id: calcul
        run: |
          if python job-bot/outils/maj_experience.py --verifier; then
            echo "change=non" >> "$GITHUB_OUTPUT"
          else
            echo "change=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Mettre à jour les fichiers et les PDF
        if: steps.calcul.outputs.change == 'oui'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm install -g md-to-pdf
          NODE_PATH="$PWD/node_modules" python job-bot/outils/maj_experience.py --pdf

      - name: Enregistrer
        if: steps.calcul.outputs.change == 'oui'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Met à jour les années d'expérience"
          git push
