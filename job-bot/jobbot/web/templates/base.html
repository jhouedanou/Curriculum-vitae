<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c6e">
<title>{% block titre %}JobBot{% endblock %}</title>
<link rel="icon" href="/static/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body{% if tache %} data-tache="{{ tache.id }}"{% endif %}>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4.5M12 17h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 10h6M9 14h6M9 18h3"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10.5 5 5 5-5"/><path d="M5 20h14"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  </defs>
</svg>

<header class="barre">
  <a class="marque" href="/" aria-label="JobBot, accueil">
    <svg class="marque-logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M9 11h14M9 16h9M9 21h11" /></svg>
    <span>JobBot</span>
  </a>
  <nav class="nav" aria-label="Sections">
    <a href="/" {% if actif == 'offres' %}aria-current="page"{% endif %}><svg class="ic"><use href="#i-list"/></svg><span>Offres</span></a>
    <a href="/suivi" {% if actif == 'suivi' %}aria-current="page"{% endif %}><svg class="ic"><use href="#i-board"/></svg><span>Suivi</span>{% if nb_relire %}<b class="pastille" title="{{ nb_relire }} dossier(s) à relire">{{ nb_relire }}</b>{% endif %}</a>
    <a href="/coller" {% if actif == 'coller' %}aria-current="page"{% endif %}><svg class="ic"><use href="#i-paste"/></svg><span>Coller une offre</span></a>
  </nav>
  <div class="barre-fin">
    <a class="btn btn-fantome cache-mobile" href="/telephone" title="Ouvrir sur le téléphone"><svg class="ic"><use href="#i-phone"/></svg><span class="sr">Téléphone</span></a>
    <form method="post" action="/lancer" data-tache-form>
      {% if cle_api %}
      <input type="hidden" name="quoi" value="go">
      <button class="btn btn-plein" type="submit" {% if tache %}disabled{% endif %} title="Collecter, noter (Claude Haiku), puis préparer les meilleurs dossiers (Claude Sonnet)">
        <svg class="ic"><use href="#i-play"/></svg><span>Lancer la recherche</span>
      </button>
      {% else %}
      <input type="hidden" name="quoi" value="collecter">
      <button class="btn btn-plein" type="submit" {% if tache %}disabled{% endif %} title="Récupérer les nouvelles offres (gratuit, sans IA)">
        <svg class="ic"><use href="#i-play"/></svg><span>Collecter les offres</span>
      </button>
      {% endif %}
    </form>
  </div>
</header>

<main class="page" id="contenu">
{% block contenu %}{% endblock %}
</main>

<aside class="tache" id="tache" hidden aria-live="polite">
  <div class="tache-tete">
    <span class="tache-etat" aria-hidden="true"></span>
    <strong class="tache-titre"></strong>
    <span class="tache-duree"></span>
    <button class="btn-icone tache-fermer" type="button" aria-label="Masquer"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <pre class="tache-journal" tabindex="0"></pre>
  <div class="tache-pied"><a class="btn btn-plein tache-lien" href="/" hidden>Voir le résultat</a></div>
</aside>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
