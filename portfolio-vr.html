<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jean Luc Houédanou — Galerie VR</title>
    <meta name="description" content="Galerie 3D et VR des projets de Jean Luc Houédanou.">
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="projects-data.js"></script>
    <script src="experience-data.js"></script>
    <script src="portfolio-vr.js"></script>
    <style>
        /* Même charte que index.html : bleu nuit, cuivre, lavande, Figtree + chasse fixe pour les libellés. */
        :root {
            --organic-bg: #111522;
            --organic-surface: #192236;
            --organic-paper: #202b43;
            --organic-ink: #f3eee5;
            --organic-muted: #a8adbb;
            --organic-orange: #c27a5b;
            --organic-orange-dark: #e0a083;
            --organic-orange-soft: rgba(194, 122, 91, .18);
            --organic-sage: #8994e4;
            --organic-sage-dark: #b8beff;
            --organic-sage-soft: rgba(137, 148, 228, .16);
            --organic-line: rgba(243, 238, 229, .16);
            --organic-sans: "Figtree", system-ui, sans-serif;
            --organic-serif: "Caprasimo", Georgia, serif;
            --organic-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; background: var(--organic-bg); color: var(--organic-ink); font-family: var(--organic-sans); }
        button { font: inherit; cursor: pointer; }
        a-scene { position: fixed; inset: 0; }
        .a-canvas.is-pointing { cursor: pointer; }

        /* Habillage 2D par-dessus la scène */
        .vr-hud { position: fixed; z-index: 20; display: flex; align-items: center; gap: 10px; pointer-events: none; }
        .vr-hud > * { pointer-events: auto; }
        .vr-hud--top { top: 0; left: 0; right: 0; justify-content: space-between; padding: 14px clamp(14px, 3vw, 34px); background: linear-gradient(rgba(17, 21, 34, .92), rgba(17, 21, 34, 0)); }
        .vr-hud--bottom { left: 0; right: 0; bottom: 0; flex-direction: column; align-items: flex-start; gap: 12px; padding: 16px clamp(14px, 3vw, 34px); background: linear-gradient(rgba(17, 21, 34, 0), rgba(17, 21, 34, .92)); }
        .vr-brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--organic-ink); font-family: var(--organic-serif); font-size: 17px; text-decoration: none; }
        .vr-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 4px; background: var(--organic-orange); color: #1b1420; font: 700 10px/1 var(--organic-sans); letter-spacing: .04em; }
        .vr-actions { display: flex; align-items: center; gap: 8px; }
        .vr-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border: 1px solid var(--organic-line); border-radius: 4px; background: rgba(17, 21, 34, .6); color: var(--organic-ink); font-size: 13px; font-weight: 700; letter-spacing: .01em; text-decoration: none; backdrop-filter: blur(10px); }
        .vr-btn:hover { background: var(--organic-paper); }
        .vr-btn--primary { border-color: transparent; background: var(--organic-orange); color: #1b1420; box-shadow: 0 8px 24px rgba(194, 122, 91, .2); }
        .vr-btn--primary:hover { background: var(--organic-orange-dark); }
        .vr-btn--lang { min-width: 44px; padding: 0 12px; font-size: 11px; letter-spacing: .08em; }
        .vr-filter { display: flex; flex-wrap: wrap; gap: 8px; }
        .vr-filter button { min-height: 40px; padding: 0 14px; border: 1px solid var(--organic-line); border-radius: 4px; background: rgba(17, 21, 34, .6); color: var(--organic-muted); font-size: 13px; backdrop-filter: blur(10px); }
        .vr-filter button:hover, .vr-filter button.is-active { border-color: var(--organic-sage); background: var(--organic-sage-soft); color: var(--organic-sage-dark); }
        .vr-hint { margin: 0; color: var(--organic-muted); font: 600 11px/1.5 var(--organic-mono); letter-spacing: .08em; text-transform: uppercase; }

        /* Fiche projet (hors casque) */
        .vr-sheet { position: fixed; z-index: 30; right: clamp(14px, 3vw, 34px); bottom: 84px; width: min(420px, calc(100% - 28px)); max-height: calc(100dvh - 170px); overflow: auto; padding: 22px; border: 1px solid var(--organic-line); border-radius: 4px; background: linear-gradient(135deg, rgba(32, 43, 67, .97), rgba(25, 34, 54, .97)); box-shadow: 0 22px 60px rgba(2, 6, 18, .5); }
        .vr-sheet[hidden] { display: none; }
        .vr-sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
        .vr-label { margin: 0 0 6px; color: var(--organic-sage-dark); font: 600 11px/1.3 var(--organic-mono); letter-spacing: .1em; text-transform: uppercase; }
        .vr-sheet h2 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.05em; line-height: 1.1; }
        .vr-sheet p { margin: 0; color: var(--organic-muted); font-size: 14px; line-height: 1.6; }
        .vr-sheet-block { margin-top: 16px; }
        .vr-close { flex: none; width: 44px; height: 44px; border: 1px solid var(--organic-line); border-radius: 4px; background: transparent; color: var(--organic-ink); font-size: 18px; }
        .vr-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .vr-tag { padding: 6px 10px; border: 1px solid transparent; border-radius: 4px; font: 600 11px/1 var(--organic-mono); }
        .vr-tag--orange { border-color: rgba(194, 122, 91, .45); background: var(--organic-orange-soft); color: var(--organic-orange-dark); }
        .vr-tag--sage { border-color: rgba(137, 148, 228, .45); background: var(--organic-sage-soft); color: var(--organic-sage-dark); }
        .vr-sheet .vr-btn { margin-top: 18px; }

        /* Écran de chargement et message d'erreur */
        .vr-loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background-color: var(--organic-bg); background-image: linear-gradient(rgba(137, 148, 228, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(137, 148, 228, .06) 1px, transparent 1px); background-size: 72px 72px; text-align: center; transition: opacity .4s ease; }
        .vr-loader.is-done { opacity: 0; pointer-events: none; }
        .vr-loader h1 { margin: 0 0 10px; font-size: clamp(30px, 6vw, 52px); font-weight: 600; letter-spacing: -.06em; line-height: 1.05; }
        .vr-loader h1 span { color: var(--organic-orange-dark); }
        .vr-loader p { max-width: 46ch; margin: 0 auto; color: var(--organic-muted); font-size: 15px; line-height: 1.6; }
        .vr-loader .vr-btn { margin-top: 22px; }

        @media (max-width: 680px) {
            .vr-brand span:last-child { display: none; }
            .vr-hint { display: none; }
            .vr-sheet { left: 10px; right: 10px; bottom: 10px; width: auto; max-height: 58dvh; }
            .vr-hud--bottom { padding-bottom: 12px; }
        }
        @media (prefers-reduced-motion: reduce) { .vr-loader { transition: none; } }
    </style>
</head>
<body>
    <div id="loader" class="vr-loader" role="status">
        <div>
            <p class="vr-label" id="loader-kicker">Galerie VR</p>
            <h1 id="loader-title">Des projets <span>à parcourir.</span></h1>
            <p id="loader-text">Chargement de la galerie…</p>
            <a id="loader-back" class="vr-btn" href="index.html#projets" hidden>← Retour au portfolio</a>
        </div>
    </div>

    <header class="vr-hud vr-hud--top">
        <a class="vr-brand" href="index.html"><span class="vr-mark">JLH</span><span>Jean Luc Houédanou</span></a>
        <div class="vr-actions">
            <button type="button" id="lang" class="vr-btn vr-btn--lang" aria-label="Passer en anglais">EN</button>
            <a id="back" class="vr-btn vr-btn--primary" href="index.html#projets">← Portfolio</a>
        </div>
    </header>

    <div class="vr-hud vr-hud--bottom">
        <p id="hint" class="vr-hint"></p>
        <div id="filters" class="vr-filter" role="group" aria-label="Filtrer les projets"></div>
    </div>

    <aside id="sheet" class="vr-sheet" hidden aria-live="polite">
        <div class="vr-sheet-head">
            <div><p id="sheet-role" class="vr-label"></p><h2 id="sheet-title"></h2></div>
            <button type="button" id="sheet-close" class="vr-close" aria-label="Fermer">×</button>
        </div>
        <div class="vr-sheet-block"><div id="sheet-tags" class="vr-tags"></div></div>
        <div class="vr-sheet-block"><p id="sheet-l1" class="vr-label"></p><p id="sheet-desc"></p></div>
        <div class="vr-sheet-block"><p id="sheet-l2" class="vr-label"></p><p id="sheet-challenges"></p></div>
        <div class="vr-sheet-block"><p id="sheet-l3" class="vr-label"></p><p id="sheet-results"></p></div>
        <a id="sheet-link" class="vr-btn vr-btn--primary" target="_blank" rel="noopener"></a>
    </aside>

    <a-scene id="scene"
             background="color: #111522"
             fog="type: exponential; color: #111522; density: 0.022"
             renderer="antialias: true; colorManagement: true"
             cursor="rayOrigin: mouse; fuse: false"
             raycaster="objects: .clickable; far: 30"
             loading-screen="enabled: false"
             device-orientation-permission-ui="enabled: false">
        <a-entity id="rig">
            <a-entity id="camera" camera="fov: 70" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 22" stay-inside="radius: 2.4"></a-entity>
            <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 30; lineColor: #e0a083; lineOpacity: .8"></a-entity>
            <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 30; lineColor: #b8beff; lineOpacity: .8"></a-entity>
        </a-entity>
        <a-entity id="floor"></a-entity>
        <a-entity id="intro"></a-entity>
        <a-entity id="controls"></a-entity>
        <a-entity id="gallery"></a-entity>
        <a-entity id="detail" visible="false"></a-entity>
    </a-scene>

</body>
</html>
